name: Kripto Alarm Cloud v3.5 ENGINE TEST

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    
concurrency:
  group: kripto-alarm-v3-5
  cancel-in-progress: false 
  
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run v3.5 engine
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALARM_CONFIG_JSON: ${{ secrets.ALARM_CONFIG_JSON }}
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python check_prices_v3_5.py

      - name: Save state
        run: |
          if [ -z "$(git status --porcelain -- state_v3.json)" ]; then
            echo "state_v3.json degismedi."
            exit 0
          fi

          echo "state_v3.json yeni veya degisti; kaydediliyor."
          git config user.name "kripto-alarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_v3.json
          git commit -m "Cloud v3.5 state update"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
