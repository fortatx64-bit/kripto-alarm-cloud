name: Kripto Alarm Cloud v3.5 PORTFOLIO TEST
on:
  workflow_dispatch:
jobs:
  portfolio-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Portfolio secret test
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
        run: python portfolio_test_v3.py
