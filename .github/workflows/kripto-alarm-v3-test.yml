name: Kripto Alarm Cloud v3 TEST
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kripto-alarm-v3-test
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cloud v3 test
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALARM_CONFIG_JSON: ${{ secrets.ALARM_CONFIG_JSON }}
        run: python check_prices_v3.py
      - name: Save v3 state
        run: |
          if git diff --quiet state_v3.json; then exit 0; fi
          git config user.name "kripto-alarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state_v3.json
          git commit -m "Cloud v3 state update"
          git push
