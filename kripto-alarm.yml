name: Kripto Alarm Cloud v2

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kripto-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fiyatları kontrol et
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_prices.py

      - name: Alarm durumunu kaydet
        run: |
          if git diff --quiet state.json; then
            echo "Durum değişmedi."
            exit 0
          fi
          git config user.name "kripto-alarm-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Alarm durumunu güncelle"
          git push
